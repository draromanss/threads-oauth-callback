<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Client Hunter · Threads OAuth</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10101b; color: #f4f2ff; padding: 24px; }
    main { width: min(100%, 620px); padding: clamp(24px, 5vw, 42px); background: #1b192d; border: 1px solid #39324e; border-radius: 24px; box-shadow: 0 24px 80px #0005; }
    .eyebrow { color: #b9a5ff; font-size: 12px; font-weight: 750; letter-spacing: 0.15em; text-transform: uppercase; }
    h1 { margin: 14px 0; font-size: clamp(26px, 5vw, 36px); line-height: 1.12; }
    p { color: #c9c4d9; line-height: 1.6; }
    label { display: block; margin: 24px 0 9px; font-size: 14px; font-weight: 700; }
    textarea, input { width: 100%; background: #100f1c; color: #f4f2ff; border: 1px solid #514663; border-radius: 10px; padding: 13px; font: 13px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
    textarea { min-height: 90px; resize: vertical; overflow-wrap: anywhere; }
    button { margin-top: 12px; width: 100%; border: 0; border-radius: 10px; padding: 14px; background: #a58afb; color: #130e25; font-weight: 800; cursor: pointer; }
    button:hover { background: #bcaaff; }
    .notice { border-left: 3px solid #a58afb; margin-top: 22px; padding: 8px 13px; background: #26213c; border-radius: 0 8px 8px 0; font-size: 13px; }
    .hidden { display: none; }
    #status { color: #d7ccff; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Client Hunter / Threads API</div>
    <h1>Авторизация Threads</h1>
    <p id="status" role="status">Проверяем результат авторизации…</p>
    <section id="success" class="hidden">
      <label for="code">Одноразовый authorization code</label>
      <textarea id="code" readonly spellcheck="false" aria-label="Authorization code"></textarea>
      <button id="copy" type="button">Скопировать код</button>
      <label for="state">Параметр state — сверь с тем, который отправлял в OAuth</label>
      <input id="state" readonly aria-label="OAuth state">
      <p class="notice">Никому не отправляй код и не добавляй его в GitHub. Сверь state, затем обменивай код на токен со своего сервера. Код одноразовый и быстро истекает.</p>
    </section>
    <p id="error" class="hidden"></p>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      // Убираем код из адресной строки до отображения. Хостинг всё равно может
      // записать исходный HTTP-запрос в собственные журналы.
      window.history.replaceState(null, '', window.location.pathname);
      const status = document.getElementById('status');
      if (error) {
        status.textContent = 'Threads не завершил авторизацию.';
        const details = document.getElementById('error');
        details.textContent = 'Ошибка: ' + error + '. Попробуй снова из настроек приложения.';
        details.classList.remove('hidden');
        return;
      }
      if (!code) {
        status.textContent = 'Страница готова к OAuth.';
        const details = document.getElementById('error');
        details.textContent = 'Добавь полный адрес этой страницы в Redirect Callback URLs приложения Meta, затем открой OAuth-ссылку. После подтверждения здесь появится код.';
        details.classList.remove('hidden');
        return;
      }
      status.textContent = 'Код получен. Проверь state перед обменом на токен.';
      document.getElementById('code').value = code;
      document.getElementById('state').value = state || '(не передан)';
      document.getElementById('success').classList.remove('hidden');
      document.getElementById('copy').addEventListener('click', async () => {
        const button = document.getElementById('copy');
        try {
          await navigator.clipboard.writeText(code);
          button.textContent = 'Код скопирован';
        } catch (_) {
          document.getElementById('code').focus();
          document.getElementById('code').select();
          button.textContent = 'Выделен: скопируй вручную';
        }
      });
    })();
  </script>
</body>
</html>
